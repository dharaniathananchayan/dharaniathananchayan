<svg xmlns="http://www.w3.org/2000/svg" width="850" height="280" viewBox="0 0 850 280">
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0D1117" rx="8" stroke="#2D1557" stroke-width="1"/>

  <!-- Title -->
  <text x="30" y="38" fill="#A78BFA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="600">Contribution Activity</text>

  <!-- Grid lines -->
  <line x1="60" y1="70" x2="800" y2="70" stroke="#161B22" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="60" y1="120" x2="800" y2="120" stroke="#161B22" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="60" y1="170" x2="800" y2="170" stroke="#161B22" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="60" y1="220" x2="800" y2="220" stroke="#21262D" stroke-width="1"/>

  <!-- Y-Axis Labels -->
  <text x="45" y="74" fill="#6E7681" font-family="sans-serif" font-size="11" text-anchor="end">30</text>
  <text x="45" y="124" fill="#6E7681" font-family="sans-serif" font-size="11" text-anchor="end">20</text>
  <text x="45" y="174" fill="#6E7681" font-family="sans-serif" font-size="11" text-anchor="end">10</text>
  <text x="45" y="224" fill="#6E7681" font-family="sans-serif" font-size="11" text-anchor="end">0</text>

  <!-- Area under curve -->
  <path d="M 60,220 L 60,200 Q 120,180 180,160 T 300,190 T 420,140 T 540,110 T 660,130 T 780,80 L 780,220 Z" fill="url(#gradient)"/>

  <!-- Line graph -->
  <path d="M 60,200 Q 120,180 180,160 T 300,190 T 420,140 T 540,110 T 660,130 T 780,80" fill="none" stroke="#8B5CF6" stroke-width="3" stroke-linecap="round"/>

  <!-- Data Points -->
  <circle cx="60" cy="200" r="4" fill="#C9D1D9" stroke="#8B5CF6" stroke-width="2"/>
  <circle cx="180" cy="160" r="4" fill="#C9D1D9" stroke="#8B5CF6" stroke-width="2"/>
  <circle cx="300" cy="190" r="4" fill="#C9D1D9" stroke="#8B5CF6" stroke-width="2"/>
  <circle cx="420" cy="140" r="4" fill="#C9D1D9" stroke="#8B5CF6" stroke-width="2"/>
  <circle cx="540" cy="110" r="4" fill="#C9D1D9" stroke="#8B5CF6" stroke-width="2"/>
  <circle cx="660" cy="130" r="4" fill="#C9D1D9" stroke="#8B5CF6" stroke-width="2"/>
  <circle cx="780" cy="80" r="4" fill="#C9D1D9" stroke="#A78BFA" stroke-width="2"/>

  <!-- X-Axis Labels (Months) -->
  <text x="60" y="245" fill="#6E7681" font-family="sans-serif" font-size="11" text-anchor="middle">Jan</text>
  <text x="180" y="245" fill="#6E7681" font-family="sans-serif" font-size="11" text-anchor="middle">Feb</text>
  <text x="300" y="245" fill="#6E7681" font-family="sans-serif" font-size="11" text-anchor="middle">Mar</text>
  <text x="420" y="245" fill="#6E7681" font-family="sans-serif" font-size="11" text-anchor="middle">Apr</text>
  <text x="540" y="245" fill="#6E7681" font-family="sans-serif" font-size="11" text-anchor="middle">May</text>
  <text x="660" y="245" fill="#6E7681" font-family="sans-serif" font-size="11" text-anchor="middle">Jun</text>
  <text x="780" y="245" fill="#6E7681" font-family="sans-serif" font-size="11" text-anchor="middle">Jul</text>
</svg>
